name: Release hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check --no-cache .
      - name: Validate architecture and Hydra configuration
        run: |
          PYTHONPATH=src python -m dresg.apps.train --cfg job >/dev/null
          PYTHONPATH=src python -m dresg.apps.train experiment=smoke_test --cfg job >/dev/null
          PYTHONPATH=src python -m pytest \
            tests/unit/test_architecture.py \
            tests/unit/test_configs.py \
            -q -p no:cacheprovider
      - name: Reject generated or heavyweight artifacts
        shell: bash
        run: |
          set -euo pipefail
          if find . -path ./.git -prune -o -type f \( \
            -name "*.pt" -o -name "*.pth" -o -name "*.ckpt" \
            -o -name "*.safetensors" -o -name "*.npz" -o -name "*.npy" \
            -o -name "*.ply" -o -name "*.mp4" -o -name "*.mov" \
            -o -name "*.avi" -o -name "*.mkv" -o -name "*.log" \
          \) -print -quit | grep -q .; then
            echo "Generated or heavyweight artifact found in the repository." >&2
            exit 1
          fi
