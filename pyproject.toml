[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    "SIM108",
    "N803",  # Camera/SH tensors use names such as K and shN.
    "N806",  # Matrix variables use names such as R, T1, and K_undist.
    "N812",
    "B905",  # Some dataset filename zips intentionally keep the historical min-length behavior.
]

[tool.ruff.lint.pep8-naming]
# Allow single-letter uppercase names for camera intrinsics (K) and common math vars.
extend-ignore-names = ["K", "Q", "V", "F"]

[tool.ruff.lint.pydocstyle]
convention = "google"
